        meetingRepeatTypes:
          type: array
          items:
            type: string
        needCheckin:
          type: boolean
        disablePersonConflict:
          type: boolean
        enableFixedBooking:
          type: boolean
        enableAgentBooking:
          type: boolean
        minDuration:
          type: integer
        supportAcrossDayBooking:
          type: boolean
        suggestStartTime:
          type: string
        suggestEndTime:
          type: string
      additionalProperties: true
      description: 多入口、通用概览和区域详情配置的字段并集。请以选中区域的配置为准；bookingLimitDays 不等于日期数组长度，也不能直接断言实际预约截止天数。
    RoomType:
      type: string
      description: 页面配置列出 7 个值；请求仅实际使用 LIB_SEAT、STATION、SEAT、CS_SEAT。其余 3 个值与所有操作的兼容性未验证；不以 enum 封闭服务器可能支持的其他类型。
    BookingCreateRequest:
      type: object
      properties:
        rooms:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              officeAreaId:
                type: string
              disabled:
                type: boolean
              showOrder:
                type: integer
              isBusy:
                type: boolean
              isBooked:
                type: boolean
              abilities:
                type: array
                items:
                  type: string
            additionalProperties: true
          description: 观测请求直接传入区域详情返回的完整座位对象；不保证仅传 id 可以成功。
        times:
          type: array
          items:
            $ref: '#/components/schemas/BookingTimeSelection'
        subject:
          type: string
          description: 8 次提交均取 profile.data.name；服务端可能调整展示标题。
        meetingMembers:
          type: array
          items:
            type: string
          description: 8 次提交均为 [profile.data.id]；代预约规则和多成员行为未验证。
      additionalProperties: true
      description: 按当前服务端响应处理。
    BookingTimeSelection:
      type: object
      properties:
        startDate:
          type: string
          format: date
        startTime:
          type: string
          description: 本次格式 HH:mm，使用校园当地时间 Asia/Shanghai；未验证其他格式。
        endDate:
          type: string
          format: date
        endTime:
          type: string
          description: 本次格式 HH:mm，使用校园当地时间 Asia/Shanghai；未验证其他格式。
      additionalProperties: true
    ApiEnvelope:
      type: object
      additionalProperties: true
      properties:
        code:
          type: integer
          description: 按当前服务端响应处理。
        data: {}
        warnMessage:
          type: string
        noticeMessage:
          type: string
        message:
          type: string
      description: 90 次实际业务请求的 HTTP 状态均为 200，业务结果由 JSON code 和提示字段决定。失败不一定有 message。
    ProfileResponse:
      type: object
      properties:
        code:
          type: integer
        data:
          $ref: '#/components/schemas/UserProfile'
      additionalProperties: true
      description: 按当前服务端响应处理。
    RecentBookingsResponse:
      type: object
      properties:
        code:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/RecentBooking'
      additionalProperties: true
      description: 按当前服务端响应处理。
    OverviewResponse:
      type: object
      properties:
        code:
          type: integer
        data:
          $ref: '#/components/schemas/DateOverview'
      additionalProperties: true
      description: 按当前服务端响应处理。
    AreasResponse:
      type: object
      properties:
        code:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/AreaNode'
      additionalProperties: true
      description: 按当前服务端响应处理。
    AreaDetailResponse:
      type: object
      properties:
        code:
          type: integer
        data:
          $ref: '#/components/schemas/AreaDetail'
      additionalProperties: true
      description: 按当前服务端响应处理。
    CreateBookingResponse:
      type: object
      properties:
        code:
          type: integer
        warnMessage:
          type: string
        message:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/BookingCreationResult'
        noticeMessage:
          type: string
      additionalProperties: true
      description: 按当前服务端响应处理。
    BookingDetailResponse:
      type: object
      properties:
        code:
          type: integer
        data:
          $ref: '#/components/schemas/BookingDetail'
      additionalProperties: true
      description: 按当前服务端响应处理。
    CancelBookingResponse:
      type: object
      properties:
        code:
          type: integer
        data:
          $ref: '#/components/schemas/BookingCancellationResult'
        noticeMessage:
          type: string
      additionalProperties: true
      description: 按当前服务端响应处理。
    FinishBookingResponse:
      type: object
      properties:
        code:
          type: integer
        noticeMessage:
          type: string
        message:
          type: string
      additionalProperties: true
      description: 按当前服务端响应处理。
    SsoPasswordLoginRequest:
      type: object
      additionalProperties: true
      properties:
        username:
          type: string
          writeOnly: true
          description: 学号/工号，示例隐藏。
        password:
          type: string
          writeOnly: true
          description: 传输值为 RSA PKCS#1 v1.5 加密后标准 base64 的密文。公钥由登录页面对应版本的 JS 提供；不要把明文或本项目回退公钥当作永久契约。
        tenantId:
          type: string
          description: POC 默认 tenant；未验证其他值。
        params:
          type: string
          writeOnly: true
          description: OAuth 上下文 JSON 的 base64url 编码，去掉 = 填充；项目文档明确指出缺少会报 badRequestParams。
      required:
      - params
      description: 字段由 POC login() 构造；仅 params 的必填性由项目文档明确报告，其余未做消融验证。
    SsoLoginContext:
      type: object
      additionalProperties: true
      properties:
        responseType:
          type: string
        clientId:
          type: string
        clientName:
          type: string
        scope:
          type: string
        redirectUri:
          type: string
          format: uri
        state:
          type: string
      description: POC runner.session_params 的解码结构。它是 params/企微 state 的内容，不是直接提交的顶层登录 JSON。
    SsoMessageResponseExpected:
      type: object
      additionalProperties: true
      properties:
        message:
          type: string
        twoStepRequired:
          type: boolean
        twoStepMethods:
          type: object
          additionalProperties: true
      description: POC 代码消费的字段，仅表示客户端期望；没有原始响应用于验证该 schema。
    SsoTwoStepSendRequest:
      type: object
      additionalProperties: true
      properties:
        method:
          type: string
          description: 从 twoStepMethods 中选择；不封闭为仅这两个方法。
    SsoTwoStepVerifyRequest:
      type: object
      additionalProperties: true
      properties:
        username:
          type: string
          writeOnly: true
          description: 学号/工号，示例隐藏。
        password:
          type: string
          writeOnly: true
          description: 传输值为 RSA PKCS#1 v1.5 加密后标准 base64 的密文。公钥由登录页面对应版本的 JS 提供；不要把明文或本项目回退公钥当作永久契约。
        tenantId:
          type: string
          description: POC 默认 tenant；未验证其他值。
        params:
          type: string
          writeOnly: true
          description: OAuth 上下文 JSON 的 base64url 编码，去掉 = 填充；项目文档明确指出缺少会报 badRequestParams。
        code:
          type: string
          writeOnly: true
          description: 用户输入的二步验证码，不能混同于 OAuth code 或二维码 auth_code。
        method:
          type: string
      required:
      - params
      description: verify_2fa_code 合并登录上下文、code、method；字段形状来自代码，运行行为未经本次测试。
  parameters:
    RoomTypeHeader:
      name: x-room-type
      in: header
      required: false
      description: 按当前服务端响应处理。
      schema:
        $ref: '#/components/schemas/RoomType'
    PlatformHeader:
      name: x-hys-platform
      in: header
      required: false
      schema:
        type: string
      description: 按当前服务端响应处理。
    LanguageHeader:
      name: x-lang
      in: header
      required: false
      schema:
        type: string
      description: 按当前服务端响应处理。
    RequestedWithHeader:
      name: X-Requested-With
      in: header
      required: false
      schema:
        type: string
      description: 按当前服务端响应处理。
    RefererHeader:
      name: Referer
      in: header
      required: false
      schema:
        type: string
      description: 业务请求携带对应入口 Referer；是否参与服务器校验未验证。
    OriginHeader:
      name: Origin
      in: header
      required: false
      schema:
        type: string
      description: 实际创建、取消、提前结束请求携带。普通浏览器会自行控制该头；是否参与服务器校验未验证。
    LanguageCookie:
      name: HYS_LANG
      in: cookie
      required: false
      schema:
        type: string
      description: 按当前服务端响应处理。
    BookingId:
      name: bookingId
      in: path
      required: true
      schema:
        type: string
      description: 来自创建响应 data[0].id 或 recent.data[].id，是预约 ID，不是座位资源 ID。示例为脱敏别名。
    AreaId:
      name: areaId
      in: path
      required: true
      schema:
        type: string
      description: 来自区域列表 data[].id 或 rooms[].officeAreaId。
    Day:
      name: day
      in: query
      required: false
      schema:
        type: string
        format: date
      description: 按当前服务端响应处理。
    Begin:
      name: begin
      in: query
      required: false
      schema:
        type: string
      description: 本次 YYYY-MM-DD 或 YYYY-MM-DD HH:mm，使用 Asia/Shanghai。应以标准 URL 编码传输空格。省略行为未验证。
    End:
      name: end
      in: query
      required: false
      schema:
        type: string
      description: 本次格式同 begin。仅选择开始时间的中间请求出现 begin 含时间而 end 只有日期，不能把这种 UI 中间状态当作最终预约区间。
    ShowChecks:
      name: showChecks
      in: query
      required: false
      schema:
        type: boolean
      description: 图书馆、24H 的详情请求使用 true，另两类未使用。仅与 checkins 字段出现有关联，未验证独立效果。
    RequestIdHeader:
      name: Request-Id
      in: header
      required: false
      schema:
        type: string
      description: POC 密码登录每次生成 UUID；是否服务端必需未知。
    OAuthCode:
      name: code
      in: query
      required: false
      schema:
        type: string
        writeOnly: true
      description: 按当前服务端响应处理。
  securitySchemes:
    HysSession:
      type: apiKey
      in: header
      name: x-hys-session
      description: 按当前服务端响应处理。
    SphysSession:
      type: apiKey
      in: cookie
      name: SPHYS_SESSION
      description: 按当前服务端响应处理。
    AuthenticityToken:
      type: apiKey
      in: cookie
      name: authenticityToken
      description: 按当前服务端响应处理。
    SsoSession:
      type: apiKey
      in: cookie
      name: SHU_OAUTH2
      description: 项目文档与 POC 复用的 SSO Cookie，与 there 的 SPHYS_SESSION 分属不同服务。按 Cookie 实际 domain/host 使用；项目声称
        oauth 与 newsso 后端互通不等于两个域的 Cookie 可直接替换。
