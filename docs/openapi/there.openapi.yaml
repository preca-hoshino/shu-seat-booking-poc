openapi: 3.1.1
info:
  title: there.shu.edu.cn 四入口预约与登录 API
  version: 1.0.0
  description: 上海大学 there 四入口业务接口及相关登录流程。字段和操作以当前服务端行为为准。
servers:
- url: https://there.shu.edu.cn
  description: 按当前服务端响应处理。
tags:
- name: 用户与预约列表
- name: 区域与可用性
- name: 预约操作
- name: 签到与二维码
- name: 页面与登录
- name: 共享 SSO 协议
  description: 按当前服务端响应处理。
- name: 企业微信登录
  description: 按当前服务端响应处理。
- name: 桌面端 v2 API
  description: 按当前服务端响应处理。
paths:
  /api/v3/my/profile:
    get:
      operationId: getCurrentProfile
