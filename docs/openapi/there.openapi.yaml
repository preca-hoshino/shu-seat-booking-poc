        AuthenticityToken: []
      responses:
        '200':
          description: 按当前服务端响应处理。
          content:
            text/html:
              schema:
                type: string
  /mobile/seat-mgr:
    get:
      operationId: openSEATPage
      tags:
      - 页面与登录
      summary: 延长智能中心页面入口
      description: 按当前服务端响应处理。
      parameters:
      - $ref: '#/components/parameters/LanguageCookie'
      security:
      - SphysSession: []
