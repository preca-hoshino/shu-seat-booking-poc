  /api/v3/bookings:
    post:
      operationId: createBooking
      tags:
      - 预约操作
      summary: 创建预约
      description: 按当前服务端响应处理。
      parameters:
      - $ref: '#/components/parameters/RoomTypeHeader'
      - $ref: '#/components/parameters/PlatformHeader'
      - $ref: '#/components/parameters/LanguageHeader'
      - $ref: '#/components/parameters/RequestedWithHeader'
      - $ref: '#/components/parameters/RefererHeader'
      - $ref: '#/components/parameters/LanguageCookie'
      - $ref: '#/components/parameters/OriginHeader'
      security:
      - HysSession: []
        SphysSession: []
        AuthenticityToken: []
      responses:
        '200':
          description: 按当前服务端响应处理。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBookingResponse'
          links:
            detailAfterSuccess:
              operationId: getBookingDetail
              parameters:
                bookingId: $response.body#/data/0/id
              description: 仅在 code=0 且 data[0].id 存在时使用；业务拒绝不产生预约 ID。
        '401':
          description: 按当前服务端响应处理。
        '403':
          description: 按当前服务端响应处理。
        '404':
          description: 按当前服务端响应处理。
        '502':
          description: 按当前服务端响应处理。
      requestBody:
        required: false
        description: 8 次均传入 body；是否可删字段未验证，不作为最小契约。
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreateRequest'
  /api/v3/bookings/{bookingId}:
    get:
      operationId: getBookingDetail
