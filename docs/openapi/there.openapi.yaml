      responses:
        '200':
          description: 按当前服务端响应处理。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinishBookingResponse'
        '401':
          description: 按当前服务端响应处理。
        '403':
          description: 按当前服务端响应处理。
        '404':
          description: 按当前服务端响应处理。
        '502':
          description: 按当前服务端响应处理。
  /api/v3/bookings/{bookingId}/checkInUse:
    post:
      operationId: checkInUseBooking
      tags:
      - 签到与二维码
      summary: 【JS 引用】签到使用预约
      description: 图书馆分包直接调用 client.post(url)，没有第二个 body 参数。没有实际请求、响应和调用条件；其他资源类型是否接受此动作未知。
      parameters:
      - $ref: '#/components/parameters/RoomTypeHeader'
      - $ref: '#/components/parameters/PlatformHeader'
      - $ref: '#/components/parameters/LanguageHeader'
      - $ref: '#/components/parameters/RequestedWithHeader'
      - $ref: '#/components/parameters/RefererHeader'
      - $ref: '#/components/parameters/LanguageCookie'
      - $ref: '#/components/parameters/BookingId'
      security:
      - HysSession: []
        SphysSession: []
        AuthenticityToken: []
      responses:
        default:
          description: 按当前服务端响应处理。
          content:
            application/json:
              schema: {}
  /mobile/libseat:
    get:
      operationId: openLIBPage
      tags:
      - 页面与登录
      summary: 校本部图书馆页面入口
      description: 按当前服务端响应处理。
      parameters:
      - $ref: '#/components/parameters/LanguageCookie'
      security:
      - SphysSession: []
        AuthenticityToken: []
      responses:
        '200':
          description: 按当前服务端响应处理。
          content:
            text/html:
              schema:
                type: string
  /mobile/seat2021:
    get:
      operationId: openSTATIONPage
      tags:
      - 页面与登录
      summary: 24H学习空间页面入口
      description: 按当前服务端响应处理。
      parameters:
