      - $ref: '#/components/parameters/PlatformHeader'
      - $ref: '#/components/parameters/LanguageHeader'
      - $ref: '#/components/parameters/RequestedWithHeader'
      - $ref: '#/components/parameters/RefererHeader'
      - $ref: '#/components/parameters/LanguageCookie'
      security:
      - HysSession: []
        SphysSession: []
        AuthenticityToken: []
      responses:
        '200':
          description: 按当前服务端响应处理。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          description: 按当前服务端响应处理。
        '403':
          description: 按当前服务端响应处理。
        '404':
          description: 按当前服务端响应处理。
        '502':
          description: 按当前服务端响应处理。
