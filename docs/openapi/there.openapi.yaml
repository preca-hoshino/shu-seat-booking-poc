      responses:
        '200':
          description: 按当前服务端响应处理。
          content:
            text/html:
              schema:
                type: string
  /mobile/csseat:
    get:
      operationId: openCSPage
      tags:
      - 页面与登录
      summary: 科学与艺术中心页面入口
      description: 按当前服务端响应处理。
      parameters:
      - $ref: '#/components/parameters/LanguageCookie'
      security:
      - SphysSession: []
        AuthenticityToken: []
      responses:
        '200':
          description: 按当前服务端响应处理。
          content:
            text/html:
              schema:
                type: string
  /login:
    get:
      operationId: openLoginPage
      tags:
      - 页面与登录
      summary: 【JS 与项目来源】站点登录入口
      description: 按当前服务端响应处理。
      security: []
      responses:
        default:
          description: 按当前服务端响应处理。
        '302':
          description: 项目报告 /login?from=web 预置 SPHYS_SESSION 后跳到授权地址；不代表所有 /login 参数的行为。
          headers:
            Location:
              schema:
                type: string
              description: 授权跳转地址；项目中该分支可包含 state。
            Set-Cookie:
              schema:
                type: string
              description: 预置本站 Cookie；真实值省略，多条 Set-Cookie 不在示例中合并。
      parameters:
      - name: from
        in: query
        required: false
        description: 项目 Web 分支使用 web；缺省入口仍由已有 JS 引用支持。
        schema:
          type: string
  /login-oauth2:
    get:
      operationId: handleThereOAuthCallback
      tags:
      - 页面与登录
      summary: 【项目来源】本站 OAuth 入口与回调
      description: 同一路径承担两种角色：不带 code 时由项目描述为授权入口；带 code 时换成 there 会话。成功 302 到 /web?authJump=...。项目记录过无
        state 成功回调和坏 code 返回 HTTP 200 空正文，不能仅靠 HTTP 200 或域名判定登录成功。
      security: []
      responses:
        '302':
          description: 项目描述的入口授权重定向，或成功回调跳转到 /web?authJump=...；按是否携带 code 区分。
          headers:
            Location:
              schema:
                type: string
              description: 入口时为 oauth/authorize；成功回调时为本站 /web?authJump=REDACTED_AUTH_JUMP。
            Set-Cookie:
              schema:
                type: string
              description: 项目报告写入/更新 SPHYS_SESSION 与 authenticityToken；实际值省略。
        '200':
          description: 项目报告坏 code 的一种失败表现是空正文、停留在回调 URL；不是成功 JSON。
          content:
            text/html:
              schema:
                type: string
        default:
          description: 其他情况未知，未在线复核。
      parameters:
      - $ref: '#/components/parameters/OAuthCode'
      - name: state
        in: query
        required: false
        description: 项目记录一条没有该参数的成功回调。其校验机制仅为作者分析，不在本次验证；不要把它当作省略关联上下文的通用建议。
        schema:
          type: string
  /web:
    get:
      operationId: openThereWebLanding
      tags:
      - 页面与登录
      summary: 【项目来源】登录后 Web 落地页
      description: 按当前服务端响应处理。
      security:
      - SphysSession: []
        AuthenticityToken: []
      responses:
        '307':
          description: 项目记录成功落地链的中间重定向，具体 Location 未提供。
          headers:
            Location:
              schema:
                type: string
        '200':
          description: 项目落地 HTML，之后 SPA 自行切换页面。
          content:
            text/html:
              schema:
                type: string
        '302':
          description: 项目描述未登录 Web 入口转 /login?from=web；原始响应未提供。
          headers:
            Location:
              schema:
                type: string
        default:
          description: 其余状态未知。
      parameters:
      - name: authJump
        in: query
        required: false
        description: 按当前服务端响应处理。
        schema:
          type: string
  /oauth/userLogin:
    post:
      operationId: ssoPasswordLogin
      tags:
      - 共享 SSO 协议
      summary: 【项目来源】密码认证
      description: 来源于 ShuSSO.login 和密码入口；password 为 RSA 密文。message=success 后仍需检查 twoStepRequired；只有所需二步完成才能按项目流程使用完整
        SSO 会话。
      security: []
      responses:
        default:
          description: 仅有 POC 消费字段，未提供本次真实响应；成功流程报告下发 SHU_OAUTH2。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoMessageResponseExpected'
      servers:
      - url: https://newsso.shu.edu.cn
        description: POC src/config.py 的 SSO_BASE；本次未访问
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoPasswordLoginRequest'
  /oauth/twoStep/send:
    post:
      operationId: ssoSendTwoStepCode
      tags:
      - 共享 SSO 协议
      summary: 【项目来源】发送二步验证码
      description: 只在 twoStepRequired=true 且 method 在服务端返回的可用集合中时进入。使用同一 SSO 会话 jar；验证码发送会产生真实外部动作，本次仅描述协议，未执行。
      security: []
      responses:
        default:
          description: POC 检查 message 是否 success；HTTP 状态和完整响应未知。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoMessageResponseExpected'
      servers:
      - url: https://newsso.shu.edu.cn
        description: POC src/config.py 的 SSO_BASE；本次未访问
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoTwoStepSendRequest'
  /oauth/twoStep/verify:
    post:
      operationId: ssoVerifyTwoStepCode
      tags:
      - 共享 SSO 协议
      summary: 【项目来源】校验二步验证码
      description: 代码将登录字段与 code/method 合并，password 仍是加密后的值；不得把二步 code 与 OAuth 授权码混同。
      security: []
      responses:
        default:
          description: POC 检查 message 是否 success；项目描述完成后建立 SHU_OAUTH2。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoMessageResponseExpected'
      servers:
      - url: https://newsso.shu.edu.cn
        description: POC src/config.py 的 SSO_BASE；本次未访问
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoTwoStepVerifyRequest'
  /oauth/authorize:
    get:
      operationId: ssoAuthorizeThere
      tags:
      - 共享 SSO 协议
      summary: 【项目来源】向本站分配授权码
      description: 本站浏览器入口在项目文档中指向 oauth 主机；POC 使用 newsso 主机的已有会话取 code。仅按 Cookie 实际域作用，不把 host-scoped
        Cookie 的复用推定成跨主机直传。
      security:
      - SsoSession: []
      responses:
        '302':
          description: 项目授权结果通过 Location 返回本站 code，或尚未登录时导航到 SSO 登录页面；不能只按 302 判定取码成功。
          headers:
            Location:
              schema:
                type: string
              description: 需检查是否为本站回调及是否含 code；示例一次性码隐藏。
        default:
          description: 其他响应未知。
      servers:
      - url: https://newsso.shu.edu.cn
        description: POC src/config.py 的 SSO_BASE；本次未访问
      - url: https://oauth.shu.edu.cn
        description: 项目文档报告 there 浏览器授权入口使用此主机；host-scoped Cookie 不可据此自动跨主机复制
      parameters:
      - name: response_type
        in: query
        required: true
        description: POC 授权码请求字段。
        schema:
          type: string
      - name: client_id
        in: query
        required: true
        description: 本站公开 OAuth client ID，不是 client secret。
        schema:
          type: string
      - name: redirect_uri
        in: query
        required: true
        description: 本站回调配置。
        schema:
          type: string
          format: uri
      - name: scope
        in: query
        required: true
        description: there 配置明确要求字符串 1；不是其他业务系统的 scope 集合。
        schema:
          type: string
      - name: state
        in: query
        required: false
        description: 由相应入口或上下文提供；项目说明有含值、空值和缺省分支。
        schema:
          type: string
  /oauth2/login/:
    get:
      operationId: openSsoLoginPage
      tags:
      - 共享 SSO 协议
      summary: 【项目来源】SSO 登录页面及公钥引导
      description: rsa_key.py 明确从此 GET 页面发现带版本哈希的 JS 清单与登录 chunk。公钥获取路径会随部署变化，不把某个哈希文件或内置回退 PEM 固定为 API。
      security: []
      responses:
        default:
          description: 项目读取 HTML 文本以发现 JS；本次未获取服务响应。
          content:
            text/html:
              schema:
                type: string
      servers:
      - url: https://newsso.shu.edu.cn
        description: POC src/config.py 的 SSO_BASE；本次未访问
  /wwopen/sso/qrConnect:
    get:
      operationId: wecomOpenLoginQr
      tags:
      - 企业微信登录
      summary: 【项目来源】企微扫码登录页面
      description: POC GET 此 HTML，从 qrImg?key=... 解析会话 key。该页面不属于 there，不使用本站 x-hys-session。
      security: []
      responses:
        default:
          description: POC 读取 HTML 并提取 key；无原始响应用于完整验证。
          content:
            text/html:
              schema:
                type: string
      servers:
      - url: https://open.work.weixin.qq.com
        description: 企微登录协议主机；本次未访问
      parameters:
      - name: appid
        in: query
        required: false
        description: 公开应用标识。
        schema:
          type: string
      - name: agentid
        in: query
        required: false
        description: 配置中的应用 agent ID。
        schema:
          type: string
      - name: redirect_uri
        in: query
        required: false
        description: 扫码确认后的 SSO 回调。
        schema:
          type: string
      - name: state
        in: query
        required: false
        description: POC 使用 base64url OAuth 上下文。
        schema:
          type: string
      - name: lang
        in: query
        required: false
        description: POC 字面参数。
        schema:
          type: string
      - name: version
        in: query
        required: false
        description: POC 字面版本，未验证其他值。
        schema:
          type: string
      - name: login_type
        in: query
        required: false
        description: POC SDK 模式字面值。
        schema:
          type: string
  /wwopen/sso/l/qrConnect:
    get:
      operationId: wecomPollLoginQr
      tags:
      - 企业微信登录
      summary: 【项目来源】等待扫码确认（POC GET/JSONP）
      description: POC 长轮询解析 JSONP，确认后取得 auth_code；这是企微一次性确认码，不是本站 bookingId，也不是下一段 SSO 授权码。
      security: []
      responses:
        default:
          description: JSONP 文本，POC 消费 status/auth_code；没有 HTTP/完整响应契约。
          content:
            application/javascript:
              schema:
                type: string
      servers:
      - url: https://open.work.weixin.qq.com
        description: 企微登录协议主机；本次未访问
      parameters:
      - name: callback
        in: query
        required: false
        description: POC JSONP 回调函数名。
        schema:
          type: string
      - name: key
        in: query
        required: false
        description: 扫码会话 key，隐藏。
        schema:
          type: string
      - name: redirect_uri
        in: query
        required: false
        description: 与扫码页面一致的回调 URI。
        schema:
          type: string
      - name: appid
        in: query
        required: false
        description: 公开应用标识。
        schema:
          type: string
      - name: _
        in: query
        required: false
        description: POC 时间戳参数；单位毫秒。
        schema:
          type: integer
  /wwopen/sso/lp/qrConnect:
    post:
      operationId: wecomBrowserLoginQrPoll
      tags:
      - 企业微信登录
      summary: 【项目来源】浏览器扫码链的 POST 轮询
      description: there 项目文档记录浏览器使用 POST /wwopen/sso/lp/qrConnect，但未提供参数和正文。它与 POC 的 GET /sso/l/qrConnect
        是不同传输分支，不能直接复用方法或参数。
      security: []
      responses:
        default:
          description: 按当前服务端响应处理。
      servers:
      - url: https://open.work.weixin.qq.com
        description: 企微登录协议主机；本次未访问
  /oauth/wecom/qrcode:
    get:
      operationId: ssoRedeemWecomCode
      tags:
      - 共享 SSO 协议
      summary: 【项目来源】企微确认码换 SSO 会话
      description: POC 使用 auth_code、state、appid 请求 newsso 回调。该 state 是 base64url 的登录上下文，不能与本站 OAuth state
        的空/缺省行为混用。
      security: []
      responses:
        '302':
          description: 项目报告建立 SHU_OAUTH2 后继续授权链；Location 需区分认证失败跳转。
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
              description: SSO Cookie，和本站 SPHYS_SESSION 分开管理。
        default:
          description: POC 将 badRequestParams 正文及 wecomAuthFailed 跳转视为失败，但状态/完整 body 未给出。
      servers:
      - url: https://newsso.shu.edu.cn
        description: POC src/config.py 的 SSO_BASE；本次未访问
      parameters:
      - name: code
        in: query
        required: true
        description: 企微轮询产生的 auth_code。
        schema:
          type: string
      - name: state
        in: query
        required: true
        description: 项目明确要求 base64url 去填充的 OAuth params 上下文。
        schema:
          type: string
      - name: appid
        in: query
        required: true
        description: 项目明确要求此公开应用标识。
        schema:
          type: string
