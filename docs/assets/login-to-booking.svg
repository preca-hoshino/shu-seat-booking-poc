<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 660" role="img" aria-labelledby="title desc"><title id="title">there 登录到预约的来源分层流程</title><desc id="desc">项目登录文档经本站会话与 HAR 移动预约连接；不代表本次重新抓到完整登录轨迹。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400"><rect x="40" y="40" width="600" height="72" rx="8" fill="#27272a" stroke="#a1a1aa" stroke-width=".5"/><text x="64" y="63" dominant-baseline="central" fill="#e0e7ff" font-size="14" font-weight="500">1 · 站点登录入口</text><text x="64" y="89" dominant-baseline="central" fill="#cbd5e1">/login?from=web</text><text x="618" y="63" text-anchor="end" dominant-baseline="central" fill="#a1a1aa" font-size="12">项目文档</text><path d="M340 112V172" fill="none" stroke="#a5b4fc" stroke-width=".5" marker-end="url(#arrow)"/><rect x="40" y="172" width="600" height="72" rx="8" fill="#27272a" stroke="#a1a1aa" stroke-width=".5"/><text x="64" y="195" dominant-baseline="central" fill="#e0e7ff" font-size="14" font-weight="500">2 · SSO 认证会话</text><text x="64" y="221" dominant-baseline="central" fill="#cbd5e1">密码 / 企微 → SHU_OAUTH2</text><text x="618" y="195" text-anchor="end" dominant-baseline="central" fill="#a1a1aa" font-size="12">项目实现</text><path d="M340 244V304" fill="none" stroke="#a5b4fc" stroke-width=".5" marker-end="url(#arrow)"/><rect x="40" y="304" width="600" height="72" rx="8" fill="#27272a" stroke="#a1a1aa" stroke-width=".5"/><text x="64" y="327" dominant-baseline="central" fill="#e0e7ff" font-size="14" font-weight="500">3 · 授权码换本站会话</text><text x="64" y="353" dominant-baseline="central" fill="#cbd5e1">/oauth/authorize → /login-oauth2</text><text x="618" y="327" text-anchor="end" dominant-baseline="central" fill="#a1a1aa" font-size="12">项目文档</text><path d="M340 376V436" fill="none" stroke="#a5b4fc" stroke-width=".5" stroke-dasharray="4 4" marker-end="url(#arrow)"/><rect x="40" y="436" width="600" height="72" rx="8" fill="#1e293b" stroke="#a5b4fc" stroke-width=".5"/><text x="64" y="459" dominant-baseline="central" fill="#e0e7ff" font-size="14" font-weight="500">4 · 页面引导与会话来源</text><text x="64" y="485" dominant-baseline="central" fill="#cbd5e1">/web → /mobile/* → sessionId</text><text x="618" y="459" text-anchor="end" dominant-baseline="central" fill="#a1a1aa" font-size="12">项目文档 + HAR</text><path d="M340 508V568" fill="none" stroke="#a5b4fc" stroke-width=".5" marker-end="url(#arrow)"/><rect x="40" y="568" width="600" height="72" rx="8" fill="#1e293b" stroke="#a5b4fc" stroke-width=".5"/><text x="64" y="591" dominant-baseline="central" fill="#e0e7ff" font-size="14" font-weight="500">5 · 移动预约闭环</text><text x="64" y="617" dominant-baseline="central" fill="#cbd5e1">/api/v3 · 查询、创建、详情、取消/结束</text><text x="618" y="591" text-anchor="end" dominant-baseline="central" fill="#a1a1aa" font-size="12">HAR 实际请求</text></g></svg>