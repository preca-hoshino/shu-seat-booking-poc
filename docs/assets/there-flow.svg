<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 510" role="img" aria-labelledby="title desc"><title id="title">there 预约流程</title><desc id="desc">已有登录会话进入页面，获取用户和区域信息，选座创建，然后查看预约并取消或结束。真正签到未被捕获。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" fill="#cbd5e1">
<rect x="40" y="40" width="260" height="64" rx="8" fill="#1e293b" stroke="#a5b4fc" stroke-width=".5"/><text x="170" y="62" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#e0e7ff">1 · 已登录页面入口</text><text x="170" y="84" text-anchor="middle" dominant-baseline="central">sessionId → x-hys-session</text>
<rect x="380" y="40" width="260" height="64" rx="8" fill="#1e293b" stroke="#a5b4fc" stroke-width=".5"/><text x="510" y="62" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#e0e7ff">2 · 用户与预约列表</text><text x="510" y="84" text-anchor="middle" dominant-baseline="central">profile · recent</text>
<path d="M300 72H380" fill="none" stroke="#a5b4fc" stroke-width=".5" marker-end="url(#arrow)"/>
<path d="M510 104V164" fill="none" stroke="#a5b4fc" stroke-width=".5" marker-end="url(#arrow)"/>
<rect x="380" y="164" width="260" height="64" rx="8" fill="#1e293b" stroke="#a5b4fc" stroke-width=".5"/><text x="510" y="186" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#e0e7ff">3 · 日期、区域与选座</text><text x="510" y="208" text-anchor="middle" dominant-baseline="central">overview · areas · areaId</text>
<rect x="40" y="164" width="260" height="64" rx="8" fill="#1e293b" stroke="#a5b4fc" stroke-width=".5"/><text x="170" y="186" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#e0e7ff">4 · 创建并核对业务结果</text><text x="170" y="208" text-anchor="middle" dominant-baseline="central">POST bookings · code = 0</text>
<path d="M380 196H300" fill="none" stroke="#a5b4fc" stroke-width=".5" marker-end="url(#arrow)"/>
<path d="M170 228V288" fill="none" stroke="#a5b4fc" stroke-width=".5" marker-end="url(#arrow)"/>
<rect x="40" y="288" width="600" height="72" rx="8" fill="#1e293b" stroke="#a5b4fc" stroke-width=".5"/><text x="340" y="313" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#e0e7ff">5 · bookingId → 详情 → 取消 / 提前结束 → recent</text><text x="340" y="337" text-anchor="middle" dominant-baseline="central">三段 DELETE cancel；24H PUT finish；最终均观测到 CANCEL</text>
<rect x="40" y="402" width="600" height="68" rx="8" fill="#27272a" stroke="#a1a1aa" stroke-width=".5"/><text x="340" y="425" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#e4e4e7">记录边界 · 实际签到未捕获</text><text x="340" y="447" text-anchor="middle" dominant-baseline="central">checkInUse 仅 JS 引用；二维码仅在响应中出现</text>
</g></svg>